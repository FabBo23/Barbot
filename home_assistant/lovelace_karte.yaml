# =============================================================================
# BarBot Statistik – Lovelace Karten
# =============================================================================
# Diese Datei NICHT in configuration.yaml einbinden!
# Karte 1 und Karte 2 jeweils separat in Lovelace → Karte → Manuell einfügen.
#
# Getränke-Entity-IDs anpassen (Entwicklerwerkzeuge → Zustände → "barbot_3000"):
#   text.barbot_3000_barbot_getrank_1_blau   (oder wie sie bei dir heißen)
# =============================================================================


# =============================================================================
# KARTE 1: Statistik-Tabelle
# In Lovelace → Karte hinzufügen → Manuell → ab "type:" einfügen
# =============================================================================

type: markdown
title: "🍷 BarBot Statistik"
content: |
  {%- set dn = [
    states('text.barbot_3000_barbot_getrank_1_blau') | default('Getränk 1', true),
    states('text.barbot_3000_barbot_getrank_2_rot')  | default('Getränk 2', true),
    states('text.barbot_3000_barbot_getrank_3_gelb') | default('Getränk 3', true)
  ] -%}
  {%- set ic = ['🔵','🔴','🟡'] -%}
  {%- set ns = namespace(out='', tot0=0, tot1=0, tot2=0, total=0) -%}
  {%- set ns.out = '| Platz | ' + ic[0] + ' ' + dn[0] + ' | ' + ic[1] + ' ' + dn[1] + ' | ' + ic[2] + ' ' + dn[2] + ' | Gesamt |\n' -%}
  {%- set ns.out = ns.out + '|:-----:|:---:|:---:|:---:|:---:|\n' -%}
  {%- for i in range(12) -%}
    {%- set p  = (i+1)|string -%}
    {%- set d0 = states('counter.barbot_platz_' + p + '_drink_0') | int(0) -%}
    {%- set d1 = states('counter.barbot_platz_' + p + '_drink_1') | int(0) -%}
    {%- set d2 = states('counter.barbot_platz_' + p + '_drink_2') | int(0) -%}
    {%- set t  = d0 + d1 + d2 -%}
    {%- set ns.tot0  = ns.tot0  + d0 -%}
    {%- set ns.tot1  = ns.tot1  + d1 -%}
    {%- set ns.tot2  = ns.tot2  + d2 -%}
    {%- set ns.total = ns.total + t -%}
    {%- set ns.out = ns.out + '| **' + p + '** | ' + d0|string + 'x | ' + d1|string + 'x | ' + d2|string + 'x | **' + t|string + 'x** |\n' -%}
  {%- endfor -%}
  {%- set ns.out = ns.out + '| **∑** | **' + ns.tot0|string + 'x** | **' + ns.tot1|string + 'x** | **' + ns.tot2|string + 'x** | **' + ns.total|string + 'x** |\n' -%}
  {{ ns.out }}
  ---
  {{ now().strftime('%d.%m.%Y %H:%M') }}


# =============================================================================
# KARTE 2: Reset-Button
# Separat als zweite Karte einfügen
# =============================================================================

type: button
name: Statistik zurücksetzen
icon: mdi:refresh
confirm:
  text: Alle Zähler wirklich auf 0 setzen?
tap_action:
  action: call-service
  service: automation.trigger
  service_data:
    entity_id: automation.barbot_statistik_zurucksetzen
