# =============================================================================
# BarBot – Getränke-Statistik pro Stellplatz (pro Getränk aufgeschlüsselt)
# =============================================================================
# In configuration.yaml einbinden:
#   counter:    !include home_assistant/barbot_statistik.yaml   # nur counter-Teil
#   automation: !include home_assistant/barbot_statistik.yaml   # nur automation-Teil
#
# ODER: counter: und automation: Abschnitte direkt in configuration.yaml kopieren.
#
# Entity-IDs prüfen unter HA → Entwicklerwerkzeuge → Zustände.
# =============================================================================


# =============================================================================
