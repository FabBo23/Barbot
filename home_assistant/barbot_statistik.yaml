      # --- Platz 1 ---
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.barbot_3000_barbot_glas_1
                state: "on"
              - condition: state
                entity_id: select.barbot_3000_barbot_slot_1_config
                state: "0"
            sequence:
              - service: counter.increment
                target: { entity_id: counter.barbot_platz_1_drink_0 }
          - conditions:
              - condition: state
                entity_id: binary_sensor.barbot_3000_barbot_glas_1
                state: "on"
