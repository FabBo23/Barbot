# =============================================================================
# BarBot – Getränke-Statistik pro Stellplatz
# =============================================================================
#
# Was wird getrackt:
#   Jedes Mal wenn BarBot fertig einschenkt (barbot/event = "DONE") wird für
#   jeden belegten Stellplatz (Glas vorhanden) ein Zähler erhöht.
#   Das Ergebnis ist sichtbar auf einer Lovelace-Karte.
#
# Einbinden in configuration.yaml:
#   counter:    !include_dir_merge_named home_assistant/counter/
#   script:     !include home_assistant/barbot_statistik.yaml  # nur script-Teil
#
# ODER: einfach jeden Abschnitt in die passende Sektion in configuration.yaml
# kopieren (counter:, script:, automation:).
#
# ENTITY IDs prüfen:
#   HA generiert Entity-IDs aus den Namen im MQTT-YAML. Prüfe die echten IDs
#   unter Entwicklerwerkzeuge → Zustände und passe ggf. unten an.
#   Erwartete IDs aus deiner bestehenden MQTT-Konfiguration:
#     binary_sensor.barbot_glas_1  … barbot_glas_12
#     select.barbot_slot_1_config  … barbot_slot_12_config
#     text.barbot_getrank_1_blau
#     text.barbot_getrank_2_rot
#     text.barbot_getrank_3_gelb
# =============================================================================


# =============================================================================
# 1) COUNTER-HELFER  (in configuration.yaml unter "counter:" eintragen)
# =============================================================================
counter:
  barbot_platz_1:  { name: "Platz 1",  step: 1, initial: 0, icon: "mdi:cup" }
  barbot_platz_2:  { name: "Platz 2",  step: 1, initial: 0, icon: "mdi:cup" }
  barbot_platz_3:  { name: "Platz 3",  step: 1, initial: 0, icon: "mdi:cup" }
  barbot_platz_4:  { name: "Platz 4",  step: 1, initial: 0, icon: "mdi:cup" }
  barbot_platz_5:  { name: "Platz 5",  step: 1, initial: 0, icon: "mdi:cup" }
  barbot_platz_6:  { name: "Platz 6",  step: 1, initial: 0, icon: "mdi:cup" }
  barbot_platz_7:  { name: "Platz 7",  step: 1, initial: 0, icon: "mdi:cup" }
  barbot_platz_8:  { name: "Platz 8",  step: 1, initial: 0, icon: "mdi:cup" }
  barbot_platz_9:  { name: "Platz 9",  step: 1, initial: 0, icon: "mdi:cup" }
  barbot_platz_10: { name: "Platz 10", step: 1, initial: 0, icon: "mdi:cup" }
  barbot_platz_11: { name: "Platz 11", step: 1, initial: 0, icon: "mdi:cup" }
  barbot_platz_12: { name: "Platz 12", step: 1, initial: 0, icon: "mdi:cup" }


# =============================================================================
# 2) AUTOMATION  (in configuration.yaml unter "automation:" oder in
#                automations.yaml eintragen)
# =============================================================================
automation:
  - id: "barbot_track_pours_on_done"
    alias: "BarBot – Pours pro Platz zählen"
    description: >
      Erhöht den Zähler jedes Stellplatzes wenn dort beim letzten
      Einschenkvorgang ein Glas stand.
    trigger:
      - platform: mqtt
        topic: barbot/event
        payload: "DONE"
    action:
      # Platz 1 (barbot/glass/0 → binary_sensor.barbot_glas_1)
      - if:
          - condition: state
            entity_id: binary_sensor.barbot_glas_1
            state: "on"
          - condition: not
            conditions:
              - condition: state
                entity_id: select.barbot_slot_1_config
                state: "-1"
        then:
          - service: counter.increment
            target: { entity_id: counter.barbot_platz_1 }
      # Platz 2
      - if:
          - condition: state
            entity_id: binary_sensor.barbot_glas_2
            state: "on"
          - condition: not
            conditions:
              - condition: state
                entity_id: select.barbot_slot_2_config
                state: "-1"
        then:
          - service: counter.increment
            target: { entity_id: counter.barbot_platz_2 }
      # Platz 3
      - if:
          - condition: state
            entity_id: binary_sensor.barbot_glas_3
            state: "on"
          - condition: not
            conditions:
              - condition: state
                entity_id: select.barbot_slot_3_config
                state: "-1"
        then:
          - service: counter.increment
            target: { entity_id: counter.barbot_platz_3 }
      # Platz 4
      - if:
          - condition: state
            entity_id: binary_sensor.barbot_glas_4
            state: "on"
          - condition: not
            conditions:
              - condition: state
                entity_id: select.barbot_slot_4_config
                state: "-1"
        then:
          - service: counter.increment
            target: { entity_id: counter.barbot_platz_4 }
      # Platz 5
      - if:
          - condition: state
            entity_id: binary_sensor.barbot_glas_5
            state: "on"
          - condition: not
            conditions:
              - condition: state
                entity_id: select.barbot_slot_5_config
                state: "-1"
        then:
          - service: counter.increment
            target: { entity_id: counter.barbot_platz_5 }
      # Platz 6
      - if:
          - condition: state
            entity_id: binary_sensor.barbot_glas_6
            state: "on"
          - condition: not
            conditions:
              - condition: state
                entity_id: select.barbot_slot_6_config
                state: "-1"
        then:
          - service: counter.increment
            target: { entity_id: counter.barbot_platz_6 }
      # Platz 7
      - if:
          - condition: state
            entity_id: binary_sensor.barbot_glas_7
            state: "on"
          - condition: not
            conditions:
              - condition: state
                entity_id: select.barbot_slot_7_config
                state: "-1"
        then:
          - service: counter.increment
            target: { entity_id: counter.barbot_platz_7 }
      # Platz 8
      - if:
          - condition: state
            entity_id: binary_sensor.barbot_glas_8
            state: "on"
          - condition: not
            conditions:
              - condition: state
                entity_id: select.barbot_slot_8_config
                state: "-1"
        then:
          - service: counter.increment
            target: { entity_id: counter.barbot_platz_8 }
      # Platz 9
      - if:
          - condition: state
            entity_id: binary_sensor.barbot_glas_9
            state: "on"
          - condition: not
            conditions:
              - condition: state
                entity_id: select.barbot_slot_9_config
                state: "-1"
        then:
          - service: counter.increment
            target: { entity_id: counter.barbot_platz_9 }
      # Platz 10
      - if:
          - condition: state
            entity_id: binary_sensor.barbot_glas_10
            state: "on"
          - condition: not
            conditions:
              - condition: state
                entity_id: select.barbot_slot_10_config
                state: "-1"
        then:
          - service: counter.increment
            target: { entity_id: counter.barbot_platz_10 }
      # Platz 11
      - if:
          - condition: state
            entity_id: binary_sensor.barbot_glas_11
            state: "on"
          - condition: not
            conditions:
              - condition: state
                entity_id: select.barbot_slot_11_config
                state: "-1"
        then:
          - service: counter.increment
            target: { entity_id: counter.barbot_platz_11 }
      # Platz 12
      - if:
          - condition: state
            entity_id: binary_sensor.barbot_glas_12
            state: "on"
          - condition: not
            conditions:
              - condition: state
                entity_id: select.barbot_slot_12_config
                state: "-1"
        then:
          - service: counter.increment
            target: { entity_id: counter.barbot_platz_12 }

  # Alle Zähler auf 0 zurücksetzen (z.B. vor einer neuen Party)
  - id: "barbot_reset_stats"
    alias: "BarBot – Statistik zurücksetzen"
    description: "Wird manuell ausgelöst oder per Button-Karte"
    trigger: []   # kein automatischer Trigger – nur manuell / via Script
    action:
      - service: counter.reset
        target:
          entity_id:
            - counter.barbot_platz_1
            - counter.barbot_platz_2
            - counter.barbot_platz_3
            - counter.barbot_platz_4
            - counter.barbot_platz_5
            - counter.barbot_platz_6
            - counter.barbot_platz_7
            - counter.barbot_platz_8
            - counter.barbot_platz_9
            - counter.barbot_platz_10
            - counter.barbot_platz_11
            - counter.barbot_platz_12


# =============================================================================
# 3) LOVELACE DASHBOARD KARTE
#    (in Lovelace → Karte hinzufügen → Manuell → YAML einfügen)
# =============================================================================
#
# Die Karte zeigt pro Platz:
#   • welches Getränk aktuell konfiguriert ist
#   • wie oft bereits eingeschenkt wurde
#   • einen Farbbalken proportional zu den Pours
#
# Hinweis: Jinja2-Templates funktionieren in Markdown-Karten.
# Entity-IDs ggf. anpassen (Entwicklerwerkzeuge → Zustände).

lovelace_card: |
  type: markdown
  title: 🍹 BarBot Statistik
  content: >
    {%- set drinks = [
      states('text.barbot_getrank_1_blau'),
      states('text.barbot_getrank_2_rot'),
      states('text.barbot_getrank_3_gelb')
    ] -%}
    {%- set slots = [
      states('select.barbot_slot_1_config')  | int(-1),
      states('select.barbot_slot_2_config')  | int(-1),
      states('select.barbot_slot_3_config')  | int(-1),
      states('select.barbot_slot_4_config')  | int(-1),
      states('select.barbot_slot_5_config')  | int(-1),
      states('select.barbot_slot_6_config')  | int(-1),
      states('select.barbot_slot_7_config')  | int(-1),
      states('select.barbot_slot_8_config')  | int(-1),
      states('select.barbot_slot_9_config')  | int(-1),
      states('select.barbot_slot_10_config') | int(-1),
      states('select.barbot_slot_11_config') | int(-1),
      states('select.barbot_slot_12_config') | int(-1)
    ] -%}
    {%- set counts = [
      states('counter.barbot_platz_1')  | int(0),
      states('counter.barbot_platz_2')  | int(0),
      states('counter.barbot_platz_3')  | int(0),
      states('counter.barbot_platz_4')  | int(0),
      states('counter.barbot_platz_5')  | int(0),
      states('counter.barbot_platz_6')  | int(0),
      states('counter.barbot_platz_7')  | int(0),
      states('counter.barbot_platz_8')  | int(0),
      states('counter.barbot_platz_9')  | int(0),
      states('counter.barbot_platz_10') | int(0),
      states('counter.barbot_platz_11') | int(0),
      states('counter.barbot_platz_12') | int(0)
    ] -%}
    {%- set max_count = counts | max | default(1) -%}
    {%- set icons = ['🔵', '🔴', '🟡'] -%}
    {%- set total = counts | sum -%}

    | Platz | Getränk | Anzahl | |
    |:-----:|---------|:------:|-|
    {%- for i in range(12) -%}
      {%- set di = slots[i] -%}
      {%- set name = drinks[di] if di >= 0 else '—' -%}
      {%- set icon = icons[di] if di >= 0 else '⬜' -%}
      {%- set c = counts[i] -%}
      {%- set bar_len = ((c / [max_count,1] | max) * 10) | round | int -%}
      {%- set bar = '█' * bar_len + '░' * (10 - bar_len) -%}
    | **{{ i+1 }}** | {{ icon }} {{ name }} | {{ c }}x | `{{ bar }}` |
    {%- endfor %}

    ---
    **Gesamt:** {{ total }} Schnäpse  |  **Letzte Aktualisierung:** {{ now().strftime('%H:%M:%S') }}
  card_mod:
    style: |
      ha-card { font-family: monospace; }

# Optional: Reset-Button-Karte
lovelace_reset_button: |
  type: button
  name: Statistik zurücksetzen
  icon: mdi:refresh
  tap_action:
    action: call-service
    service: automation.trigger
    service_data:
      entity_id: automation.barbot_statistik_zurucksetzen
